name: Keep Supabase Alive

# Free-tier Supabase pauses projects with low DB activity after ~7 days.
# This workflow pings PostgREST daily so the project stays active.
# Docs: https://supabase.com/docs/guides/platform/free-project-pausing

on:
  schedule:
    # Every day at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (database activity)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing GitHub secrets: NEXT_PUBLIC_SUPABASE_URL and/or NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "Add them under Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Tiny SELECT counts as user database activity (not just Auth health).
          STATUS=$(curl -sS -o /tmp/supabase-keepalive.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/inquiries?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "HTTP status: ${STATUS}"
          cat /tmp/supabase-keepalive.json || true
          echo

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Keep-alive ping failed"
            exit 1
          fi

          echo "Supabase keep-alive ping succeeded"
